<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Muxterm application icon</title>
  <desc id="desc">The selected wide-sided M and X logo with reduced visual scale for macOS application surfaces.</desc>
<defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091625" />
      <stop offset="1" stop-color="#1a3044" />
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70e6b5" />
      <stop offset="1" stop-color="#35c99e" />
    </linearGradient>
  </defs>
  <!-- macOS 图标保留约 9% 透明边距，接近 iTerm2 的视觉占比。 -->
  <g transform="translate(90 90) scale(0.82)">


  <rect width="1000" height="1000" rx="238" fill="url(#background)" />

  <!-- M：136px 竖线，两侧外缘固定并严格镜像。 -->
  <path fill="#f4f0e6" d="M200 790V210h136v580Z" />
  <path fill="#f4f0e6" d="M800 790V210h-136v580Z" />
  <path fill="#f4f0e6" d="M240 210h120l169 250H409Z" />
  <path fill="#f4f0e6" d="M640 210h120L591 460H471Z" />

  <!-- X：保留正式 B 的尺寸与重合关系。 -->
  <path fill="url(#mint)" d="M335.2 350h120l204 300H539.2Z" />
  <path fill="url(#mint)" d="M544.8 350h120L460.8 650H340.8Z" />

  </g>
</svg>
