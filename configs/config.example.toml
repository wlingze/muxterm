# Muxterm unified configuration example
# 复制到 ~/.config/muxterm/config.toml 即可生效。
#
# Project、主题、字体和快捷键都在这一份文档中；旧 quickconnect.toml
# 只作为一次迁移输入，Recent 不落盘，由连接池运行时派生。

# 字体
[font]
family = "JetBrains Mono"
size = 13.0
fallback = ["Noto Sans Mono", "monospace"]

# status bar 模式：tmux = 有 tmux 就跟 tmux 完全一致（默认）；
# theme = 用 muxterm 主题黑/白渲染（忽略 tmux 配色）
[statusbar]
mode = "tmux"

# 连接池：warm 连接上限（同时决定 QuickConnect Recent 显示条数上限）
[pool]
max_slots = 5

# 主题（对应 configs/themes/<name>.toml）
[theme]
name = "system" # system / black / white
light = "white"
dark = "black"

# Project 是 Workspace 的启动规格；runtime/transport 由 Core Catalog 解释。
[[projects]]
id = "muxterm@local"
name = "Muxterm"
path = "~/Developer/self/muxterm"
command = ["$SHELL", "-l"]
env = { RUST_LOG = "info" }

[projects.runtime]
id = "tmux"
session = "muxterm"
socket = ""

[projects.transport]
id = "local"
target = ""

# Shortcut preset + 用户覆盖。旧 [[keybindings]] 仍可读取并迁移。
[shortcuts]
preset = "qwerty"
primary_key = "auto" # Linux=Alt，macOS=Command

[[shortcuts.overrides]]
action = "quick_connect"
[[shortcuts.overrides.bindings]]
key = "KeyP"
modifiers = ["primary"]

# tmux
[tmux]
auto_mouse = true       # attach 后自动 set -g mouse on
default_session = ""    # 空则不自动 attach
# socket = "muxterm"    # 可选；也可用 CLI -L/--socket 隔离 tmux server

# SSH 远程 tmux -CC（命令面板 "ssh: connect"）
[ssh]
host = ""               # 如 "example.com"；空则需在 QuickPick 里输入
port = 22
user = ""               # 空则用 $USER
key_path = ""           # 私钥路径；空则尝试 ssh-agent

# scrollback
[scrollback]
lines = 10000

# UI 极简布局
[ui]
tab_bar_position = "bottom"  # 或 "top"
tab_bar_height = 24
show_title_bar = true
borderless = false

# 本地 pane 默认程序
[pane]
default_command = "$SHELL"   # 或 bash / zsh / 具体路径
workdir = "$HOME"

# 程序退出行为
[behavior]
on_last_pane_exit = "close_window"       # close_window / keep_empty / new_shell(废弃)
on_program_exit_abnormal = "notify"      # notify / close / keep

# 快捷键（可自定义，mods: control/shift/alt/super）
[[keybindings]]
key = "n"
mods = ["alt"]
action = "new_window"      # tmux new-window = 新 tab + 新 pane

[[keybindings]]
key = "t"
mods = ["alt"]
action = "new_tab"         # 新本地 shell tab

[[keybindings]]
key = "d"
mods = ["alt"]
action = "new_pane"        # 当前 tab 内水平分割

[[keybindings]]
key = "D"
mods = ["alt", "shift"]
action = "new_pane_vertical"  # 垂直分割

[[keybindings]]
key = "1"
mods = ["alt"]
action = "switch_tab_1"

[[keybindings]]
key = "2"
mods = ["alt"]
action = "switch_tab_2"

[[keybindings]]
key = "3"
mods = ["alt"]
action = "switch_tab_3"

[[keybindings]]
key = "4"
mods = ["alt"]
action = "switch_tab_4"

[[keybindings]]
key = "5"
mods = ["alt"]
action = "switch_tab_5"

[[keybindings]]
key = "6"
mods = ["alt"]
action = "switch_tab_6"

[[keybindings]]
key = "7"
mods = ["alt"]
action = "switch_tab_7"

[[keybindings]]
key = "8"
mods = ["alt"]
action = "switch_tab_8"

[[keybindings]]
key = "9"
mods = ["alt"]
action = "switch_tab_9"

[[keybindings]]
key = "0"
mods = ["alt"]
action = "switch_tab_last"

[[keybindings]]
key = "["
mods = ["alt"]
action = "switch_pane_prev"

[[keybindings]]
key = "]"
mods = ["alt"]
action = "switch_pane_next"

[[keybindings]]
key = "r"
mods = ["alt"]
action = "search"

[[keybindings]]
key = "p"
mods = ["alt"]
action = "quick_connect"

[[keybindings]]
key = "p"
mods = ["alt", "shift"]
action = "command_palette"

[[keybindings]]
key = "c"
mods = ["control", "shift"]
action = "copy"

[[keybindings]]
key = "v"
mods = ["control", "shift"]
action = "paste"
