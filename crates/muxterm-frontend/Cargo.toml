[package]
name = "muxterm-frontend"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
tui = ["dep:crossterm", "dep:ratatui", "dep:vte"]

[dependencies]
anyhow = "1"
muxterm-core = { path = "../muxterm-core", features = ["ffi"] }
muxterm-protocol = { path = "../muxterm-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"

crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", optional = true }
vte = { version = "0.13", default-features = false, features = ["ansi"], optional = true }

[target."cfg(unix)".dependencies]
libc = "0.2"
