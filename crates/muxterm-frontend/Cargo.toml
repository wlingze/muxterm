[package]
name = "muxterm-frontend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
muxterm-core = { path = "../muxterm-core", features = ["ffi"] }
muxterm-protocol = { path = "../muxterm-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"

[target."cfg(unix)".dependencies]
libc = "0.2"
