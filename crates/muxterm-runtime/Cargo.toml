[package]
name = "muxterm-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
muxterm-protocol = { path = "../muxterm-protocol" }
muxterm-transport = { path = "../muxterm-transport" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1"
