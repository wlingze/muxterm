[package]
name = "muxterm"
version = "0.1.0"
edition = "2021"
description = "Native UI terminal for tmux control mode (Linux)"
license = "MIT"

[features]
# 默认编译 GTK4 前端（archmini 等 GTK 机器用）。
default = ["gtk"]
# GTK4 原生前端：依赖 gtk4 / vte4，并通过 ffi 调用核心。
gtk = ["dep:gtk4", "dep:vte4", "dep:yeslogic-fontconfig-sys", "ffi"]
# TUI 前端：纯 crossterm + ratatui，经 ffi 调用核心（CI / 无头，跨平台）。
tui = ["dep:crossterm", "dep:ratatui", "ffi"]
# GPUI 前端：一份 Rust widget 树跑 macOS / Linux / Windows（见 docs/FRONTEND-GPUI.md）。
gpui = ["dep:gpui", "dep:unicode-width", "ffi", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
# C ABI 导出（不依赖任何 GUI）。
ffi = []
# Integration tests that still construct provider types. Production builds
# keep runtime/{tmux,herdr,shell} crate-private.
test-harness = []

[lib]
name = "muxterm"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# 核心依赖（始终需要，无系统 GUI 依赖）
vte = { version = "0.13", default-features = false, features = ["ansi"] }
toml = "0.8"
toml_edit = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
regex = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
async-channel = "2"
async-trait = "0.1"
async-ssh2-tokio = "0.13"
# 客户端自更新：检查 GitHub Release、下载、校验、原子安装。
ureq = { version = "3", default-features = false, features = ["rustls"] }
semver = "1"
tar = "0.4"
flate2 = "1"
sha2 = "0.11"
hex = "0.4"
# PTY：Unix 走 openpty，Windows 走 ConPTY。三平台共用同一套
# `portable-pty` API，上层不再按平台分叉（见 `src/core/os.rs`）。
portable-pty = "0.8"


# 可选：跨平台 TUI 前端
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", optional = true }

# 可选：跨平台 GUI 前端（Zed 的 gpui）
gpui = { version = "0.2.2", optional = true }
# 可选：gpui 的 CellGrid 需要东亚宽字符判定（CJK 占两格），与 SwiftTerm
# 的 `UnicodeWidthData` 同义。只在 gpui feature 下启用。
unicode-width = { version = "0.2", optional = true }

# 可选：Linux bundled font registration
# macOS 原生菜单栏（NSMenu）。已在 gpui 的依赖树里，不会引入新的下载。
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# 本地事件监视器要传 block（NSEvent addLocalMonitorForEvents:handler:）。
# gpui 已经把它编进来了，这里只是直连，不增加新的编译负担。
block = "0.1"
# 剪贴板 TIFF/JPEG → PNG（Core 的图片粘贴只收 PNG）。gpui 已经把这两个
# crate 编进来了，这里只是直连，不增加新的编译负担。
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSPasteboard",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSData",
    "NSDictionary",
    "NSString",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# 仅 GTK 前端注册内置字体用；gpui 前端走 `TextSystem::add_fonts`，
# 不需要 fontconfig 的 C 依赖（Linux CI 的 gpui job 因此不装 fontconfig）。
yeslogic-fontconfig-sys = { version = "6", optional = true }

# 可选：GTK4 前端
gtk4 = { version = "0.9", optional = true }
# v0_76：Terminal::text_format，GTK 测试校验 VTE 可见文本（防分割后黑屏）
vte4 = { version = "0.8", optional = true, features = ["v0_76"] }

[target."cfg(unix)".dependencies]
# 仅 Unix：POSIX 信号 / fcntl / getrusage。Windows 的等价能力在
# `src/core/os.rs` 里用 std 实现（taskkill 等）。
libc = "0.2"

# gpui 测试 harness（TestAppContext）：三平台都要，Linux / Windows 的
# 原生 runner 才能跑同一套无头 UI 验收。
#
# 历史：gpui → gpui_http_client → zed-async-tar → xattr 0.2.3 在 Linux 上用
# `libc::ENOATTR`（Linux 只有 ENODATA）编不过，所以这里曾经只给 macOS。
# 现在 `vendor/xattr` 打了这个补丁（见文末 `[patch.crates-io]`），三平台都能编。
[dev-dependencies]
pretty_assertions = "1"
gpui = { version = "0.2.2", features = ["test-support"] }

