# ── 本地补丁 ────────────────────────────────────────────────
# xattr 0.2.3 在 Linux / Android 上引用不存在的 `libc::ENOATTR`，会拖死
# gpui 的依赖链（gpui → gpui_http_client → zed-async-tar → xattr）。
# 仓库内 `vendor/xattr` 是同一版本的原样拷贝，只把 Linux 的错误码映射到
# `ENODATA`；补丁说明见 `vendor/xattr/PATCH.md`。
[patch.crates-io]
xattr = { path = "vendor/xattr" }

# GUI 开发者构建：保留 dev 的 debug 断言，但让热路径（VTE 解析 / ANSI 重编码）
# 走优化。`build-macos.sh` 默认用它链接 .app；未优化解析实测慢 7-9 倍
# （17 pane 的 98KB Index snapshot 洪峰：595ms vs 82ms）。
[profile.gui]
inherits = "dev"
opt-level = 2
