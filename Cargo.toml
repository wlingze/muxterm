[package]
name = "muxterm"
version = "0.1.0"
edition = "2021"
description = "Native UI terminal for tmux control mode (Linux)"
license = "MIT"

[features]
# 默认编译 GTK4 前端（archmini 等 GTK 机器用）。
default = ["gtk"]
# GTK4 原生前端：依赖 gtk4 / vte4，并通过 ffi 调用核心。
gtk = ["dep:gtk4", "dep:vte4", "ffi"]
# TUI 前端：纯 crossterm + ratatui，经 ffi 调用核心（CI / 无头，跨平台）。
tui = ["dep:crossterm", "dep:ratatui", "ffi"]
# C ABI 导出（不依赖任何 GUI）。
ffi = []

[lib]
name = "muxterm"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# 核心依赖（始终需要，无系统 GUI 依赖）
vte = { version = "0.13", default-features = false, features = ["ansi"] }
toml = "0.8"
toml_edit = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
regex = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
async-channel = "2"
async-trait = "0.1"
async-ssh2-tokio = "0.13"

# 可选：GTK4 前端
gtk4 = { version = "0.9", optional = true }
# v0_76：Terminal::text_format，GTK 测试校验 VTE 可见文本（防分割后黑屏）
vte4 = { version = "0.8", optional = true, features = ["v0_76"] }

# 可选：TUI 前端
crossterm = { version = "0.28", optional = true }
ratatui = { version = "0.29", optional = true }

[target."cfg(unix)".dependencies]
# 仅 Unix: 为 tmux -CC 子进程分配 pty
# （tmux 在非 tty 的 stdout 下会立即报错退出）
portable-pty = "0.8"
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1"

