[package]
name = "muxterm"
version = "0.1.0"
edition = "2021"
description = "Native UI terminal for tmux control mode (Linux)"
license = "MIT"

[dependencies]
vte = "0.13"
gtk4 = "0.9"
vte4 = "0.8"
toml = "0.8"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
async-channel = "2"
async-trait = "0.1"

[target."cfg(unix)".dependencies]
# 仅 Unix: 为 tmux -CC 子进程分配 pty
# （tmux 在非 tty 的 stdout 下会立即报错退出）
portable-pty = "0.8"
libc = "0.2"

[dev-dependencies]
pretty_assertions = "1"
