[package]
name = "muxterm"
version = "0.1.0"
edition = "2021"
description = "Native UI terminal for tmux control mode (Linux)"
license = "MIT"

[dependencies]
vte = "0.13"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
async-channel = "2"

[dev-dependencies]
pretty_assertions = "1"
