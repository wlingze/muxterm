name: "CI: macos"

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/platform/macos/**'
      - 'src/core/**'
      - 'src/platform/cli/**'
      - 'src/platform/mod.rs'
      - 'src/lib.rs'
      - 'tests/macos_integration.rs'
      - 'tests/support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/build-macos.sh'
      - 'scripts/build-common.sh'
      - 'scripts/ci/**'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos_checks:
    name: macos / required
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version
          /usr/bin/automationmodetool || true

      - name: Install tools
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          tmux -V

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-macos-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Package.resolved') }}

      - name: cargo build ffi (release)
        run: cargo build --release --no-default-features --features ffi

      - name: cargo test macos integration
        run: cargo test --no-default-features --features ffi --test macos_integration
        timeout-minutes: 15

      - name: Link libmuxterm.a into Vendor (Swift links local ./target)
        run: |
          set -euo pipefail
          mkdir -p src/platform/macos/Vendor
          ln -sfn "$PWD/target/release/libmuxterm.a" src/platform/macos/Vendor/libmuxterm.a

      # Headless Swift unit tests (ChromeTests): keyboard bindings / pane switching /
      # PaneOutputCursor are pure logic and need no GUI. Runs on every PR, guarding
      # against regressions without consuming desktop/disk like XCUITest would.
      # CI mirrors local headless testing (see AGENTS.md); desktop XCUITests are
      # intentionally not run here.
      - name: Swift unit tests (headless)
        working-directory: src/platform/macos
        run: swift test --disable-swift-testing
