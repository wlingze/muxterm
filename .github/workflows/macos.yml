name: "CI: macos"

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/platform/macos/**'
      - 'src/core/**'
      - 'src/platform/cli/**'
      - 'src/platform/mod.rs'
      - 'src/lib.rs'
      - 'tests/macos_integration.rs'
      - 'tests/support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/build-macos.sh'
      - 'scripts/ci/**'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos_checks:
    name: macos / required
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../muxterm-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version
          /usr/bin/automationmodetool || true

      - name: Install tools
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          tmux -V
          xcodegen --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/../muxterm-target
          key: ${{ runner.os }}-macos-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Package.resolved') }}

      - name: cargo build ffi (release)
        run: cargo build --release --no-default-features --features ffi

      - name: cargo test macos integration
        run: cargo test --no-default-features --features ffi --test macos_integration
        timeout-minutes: 15

      # 无 GUI 的 Swift 单测（ChromeTests）：快捷键/pane 切换/PaneOutputCursor 纯逻辑。
      # 相比 XCUITest 不占桌面/大量磁盘，任何 PR 都会跑，守护快捷键回归。
      - name: Swift unit tests (headless)
        working-directory: src/platform/macos
        run: swift test --disable-swift-testing

      - name: Generate Xcode project
        working-directory: src/platform/macos
        run: |
          mkdir -p Vendor
          ln -sfn ../../../../../muxterm-target/release/libmuxterm.a Vendor/libmuxterm.a
          xcodegen generate

      - name: XCUITest
        working-directory: src/platform/macos
        run: |
          set -o pipefail
          xcodebuild test \
            -project Muxterm.xcodeproj \
            -scheme MuxtermApp \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MuxtermAppUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            ENABLE_DEBUG_DYLIB=NO \
            | xcbeautify --renderer github-actions
