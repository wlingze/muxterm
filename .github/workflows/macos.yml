name: "CI: macos"

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/platform/macos/**'
      - 'src/core/**'
      - 'src/platform/cli/**'
      - 'src/platform/mod.rs'
      - 'src/lib.rs'
      - 'tests/macos_integration.rs'
      - 'tests/support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/build-macos.sh'
      - 'scripts/build-common.sh'
      - 'scripts/ci/**'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos_checks:
    name: macos / required
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version
          /usr/bin/automationmodetool || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install tools (tmux / herdr)
        run: bash scripts/ci/setup.sh
        timeout-minutes: 20

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-macos-${{ hashFiles('Cargo.toml', 'Cargo.lock', '**/Package.resolved') }}

      # §13.2：单一入口。build/test/patch/Swift 全部由 scripts/test.sh run macos 承载，
      # workflow 不再复制 cargo 命令序列。
      - name: Run all macOS tests (one entry)
        run: bash scripts/test.sh run macos
        timeout-minutes: 30
