name: "CI: core"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/**"
      - "src/platform/cli/**"
      - "src/platform/tui/**"
      - "src/platform/mod.rs"
      - "src/lib.rs"
      - "src/main.rs"
      - "tests/cli_integration.rs"
      - "tests/four_mode_integration.rs"
      - "tests/sendkeys_regression.rs"
      - "tests/split_regression.rs"
      - "tests/tui_split_ffi_regression.rs"
      - "tests/tui_wizard_ffi_regression.rs"
      - "tests/tui_wizard_ssh_ffi_regression.rs"
      - "tests/ssh_no_fallback.rs"
      - "tests/ssh_transport_unit.rs"
      - "tests/tmux_backend_integration.rs"
      - "tests/tui_integration.rs"
      - "tests/herdr_session_contract.rs"
      - "tests/herdr_feature_contract.rs"
      - "tests/herdr_authority_contract.rs"
      - "tests/herdr_multi_workspace_contract.rs"
      - "tests/herdr_worktree_contract.rs"
      - "tests/existing_ssh_contract.rs"
      - "tests/runtime_transport_matrix_contract.rs"
      - "tests/support/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-cli.sh"
      - "scripts/build-common.sh"
      - "scripts/build-tui.sh"
      - "scripts/ci/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  core_tests:
    name: core / tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (tmux / herdr / sshd)
        run: MUXTERM_ENV_FILE="$GITHUB_ENV" bash scripts/ci/setup.sh
        timeout-minutes: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      # 与本地 scripts/test.sh 同一入口：一次编译、一起跑全部测试。
      # fmt/clippy/全部 target 都在 test.sh 内，避免 CI 与本地两套命令 drift。
      - name: Run all core tests (one compile)
        run: bash scripts/test.sh run core

      - name: Cleanup sshd
        if: always()
        run: |
          if [ -n "${MUXTERM_SSHD_TMP_DIR:-}" ] && [ -f "$MUXTERM_SSHD_TMP_DIR/sshd.pid" ]; then
            kill "$(cat "$MUXTERM_SSHD_TMP_DIR/sshd.pid")" 2>/dev/null || true
            rm -rf "$MUXTERM_SSHD_TMP_DIR"
          fi

  four_mode:
    name: four-mode / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: local-shell
            filter: local_shell_cli
            ssh: false
          - case: local-tmux
            filter: local_tmux_cli
            ssh: false
          - case: ssh-shell
            filter: ssh_shell_cli
            ssh: true
          - case: ssh-tmux
            filter: ssh_tmux_cli
            ssh: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            tmux \
            openssh-server \
            openssh-client

      - name: Setup shared loopback sshd
        if: matrix.ssh == true
        run: |
          set -euo pipefail
          MUXTERM_ENV_FILE="$RUNNER_TEMP/muxterm-sshd.env" bash scripts/ci/setup-sshd.sh
          cat "$RUNNER_TEMP/muxterm-sshd.env" >> "$GITHUB_ENV"
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-four-mode-${{ matrix.case }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Build FFI binary
        run: cargo build --no-default-features --features ffi

      - name: Run local Four-Mode case
        if: matrix.ssh == false
        run: timeout 120 cargo test --no-default-features --features ffi --test four_mode_integration -- ${{ matrix.filter }} --nocapture

      - name: Run SSH Four-Mode case
        if: matrix.ssh == true
        run: timeout 120 cargo test --no-default-features --features ffi --test four_mode_integration -- ${{ matrix.filter }} --nocapture --ignored
        env:
          RUST_BACKTRACE: 1

      - name: Upload sshd logs on failure
        if: failure() && matrix.ssh == true
        uses: actions/upload-artifact@v4
        with:
          name: sshd-logs-${{ matrix.case }}
          path: ${{ env.MUXTERM_SSHD_TMP_DIR }}
          retention-days: 7

      - name: Cleanup sshd
        if: always() && matrix.ssh == true
        run: |
          if [ -n "${MUXTERM_SSHD_TMP_DIR:-}" ] && [ -f "$MUXTERM_SSHD_TMP_DIR/sshd.pid" ]; then
            kill "$(cat "$MUXTERM_SSHD_TMP_DIR/sshd.pid")" 2>/dev/null || true
            rm -rf "$MUXTERM_SSHD_TMP_DIR"
          fi

  four_mode_aggregate:
    name: four-mode / aggregate
    if: always()
    needs: [four_mode]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Four-Mode cases
        run: test "${{ needs.four_mode.result }}" = success

  core_required:
    name: core / required
    if: always()
    needs: [core_tests, four_mode_aggregate]
    runs-on: ubuntu-latest
    steps:
      - name: Require core and Four-Mode aggregates
        run: |
          test "${{ needs.core_tests.result }}" = success
          test "${{ needs.four_mode_aggregate.result }}" = success
