name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ubuntu：core / TUI（fmt + clippy + test）
  ci:
    name: check / fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            tmux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --no-default-features --features tui -- -D warnings

      - name: cargo test
        run: cargo test --no-default-features --features tui
        timeout-minutes: 15

      - name: Install GTK4 deps
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libssl-dev

      - name: cargo check gtk
        # 只编译检查：CI runner 无显示器，不跑 GTK UI 测试
        run: cargo check --features gtk

  # 路径过滤（workflow 级 paths 无法按 job 过滤，用 dorny/paths-filter）
  changes:
    name: path filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      linux: ${{ steps.filter.outputs.linux }}
    steps:
      # push 事件用 git 比对，需 checkout；PR 事件走 REST API，可不 checkout
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            linux:
              - 'src/platform/linux/**'

  # Linux GTK 集成测试（仅 src/platform/linux/ 变动时跑）
  linux-gtk:
    name: linux-gtk
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 覆盖仓库 .cargo/config.toml 的 ../muxterm-target，避免 CI 写到 workspace 外
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK / VTE / xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config tmux xvfb \
            libgtk-4-dev libvte-2.91-gtk4-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-gtk-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo clippy --features gtk -- -D warnings
      - name: GTK integration tests (only linux_gtk_integration)
        run: xvfb-run -a cargo test --features gtk --test linux_gtk_integration -- --test-threads=1

  # macOS：FFI release 构建 → macos_integration → XCUITest
  # macos-latest 现为 macos-26（核对时间 2026-07-24，
  # https://github.com/actions/runner-images/issues/14167 ）
  macos:
    name: macos / ffi / XCUITest
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # 与 .cargo/config.toml 的 ../muxterm-target 对齐（相对仓库根）
      CARGO_TARGET_DIR: ${{ github.workspace }}/../muxterm-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version
          /usr/bin/automationmodetool || true

      - name: Install tools
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          tmux -V
          xcodegen --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/../muxterm-target
          key: ${{ runner.os }}-macos-cargo-${{ hashFiles('**/Cargo.toml', '**/Package.resolved') }}

      - name: cargo build ffi (release)
        run: cargo build --release --no-default-features --features ffi

      - name: cargo test macos_integration
        # 与 release 构建同 feature 集；勿拉默认 gtk
        run: cargo test --no-default-features --features ffi --test macos_integration
        timeout-minutes: 15

      - name: Generate Xcode project
        working-directory: src/platform/macos
        run: |
          mkdir -p Vendor
          ln -sfn ../../../../../muxterm-target/release/libmuxterm.a Vendor/libmuxterm.a
          xcodegen generate

      - name: XCUITest
        working-directory: src/platform/macos
        run: |
          set -o pipefail
          xcodebuild test \
            -project Muxterm.xcodeproj \
            -scheme MuxtermApp \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MuxtermAppUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            ENABLE_DEBUG_DYLIB=NO \
            | xcbeautify --renderer github-actions
