name: Core / shared

on:
  push:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'src/platform/cli/**'
      - 'src/platform/tui/**'
      - 'src/platform/mod.rs'
      - 'src/lib.rs'
      - 'src/main.rs'
      - 'tests/cli_integration.rs'
      - 'tests/four_mode_integration.rs'
      - 'tests/sendkeys_regression.rs'
      - 'tests/split_regression.rs'
      - 'tests/ssh_no_fallback.rs'
      - 'tests/ssh_transport_unit.rs'
      - 'tests/tmux_backend_integration.rs'
      - 'tests/tui_integration.rs'
      - 'tests/support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/build-cli.sh'
      - 'scripts/build-tui.sh'
      - 'scripts/ci/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'src/platform/cli/**'
      - 'src/platform/tui/**'
      - 'src/platform/mod.rs'
      - 'src/lib.rs'
      - 'src/main.rs'
      - 'tests/cli_integration.rs'
      - 'tests/four_mode_integration.rs'
      - 'tests/sendkeys_regression.rs'
      - 'tests/split_regression.rs'
      - 'tests/ssh_no_fallback.rs'
      - 'tests/ssh_transport_unit.rs'
      - 'tests/tmux_backend_integration.rs'
      - 'tests/tui_integration.rs'
      - 'tests/support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/build-cli.sh'
      - 'scripts/build-tui.sh'
      - 'scripts/ci/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  core_tests:
    name: core / tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            tmux \
            openssh-server \
            openssh-client \
            python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --no-default-features --features tui -- -D warnings

      - name: Setup shared loopback sshd
        run: MUXTERM_ENV_FILE="$GITHUB_ENV" bash scripts/ci/setup-sshd.sh

      - name: Core unit tests
        run: cargo test --no-default-features --features tui --lib --bins

      - name: CLI integration tests
        run: cargo test --no-default-features --features tui --test cli_integration -- --test-threads=1

      - name: Sendkeys regression tests
        run: cargo test --no-default-features --features ffi --test sendkeys_regression -- --test-threads=1

      - name: Split regression tests
        run: cargo test --no-default-features --features ffi --test split_regression -- --test-threads=1

      - name: SSH no-fallback tests
        run: cargo test --no-default-features --features ffi --test ssh_no_fallback -- --test-threads=1

      - name: SSH transport tests
        run: cargo test --no-default-features --features ffi --test ssh_transport_unit -- --test-threads=1

      - name: Tmux backend integration tests
        run: cargo test --no-default-features --features tui --test tmux_backend_integration -- --test-threads=1

      - name: TUI integration tests
        run: cargo test --no-default-features --features tui --test tui_integration -- --test-threads=1

      - name: Cleanup sshd
        if: always()
        run: |
          if [ -n "${MUXTERM_SSHD_TMP_DIR:-}" ] && [ -f "$MUXTERM_SSHD_TMP_DIR/sshd.pid" ]; then
            kill "$(cat "$MUXTERM_SSHD_TMP_DIR/sshd.pid")" 2>/dev/null || true
            rm -rf "$MUXTERM_SSHD_TMP_DIR"
          fi

  four_mode:
    name: four-mode / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: local-shell
            filter: local_shell_cli
            ssh: false
          - case: local-tmux
            filter: local_tmux_cli
            ssh: false
          - case: ssh-shell
            filter: ssh_shell_cli
            ssh: true
          - case: ssh-tmux
            filter: ssh_tmux_cli
            ssh: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            tmux \
            openssh-server \
            openssh-client

      - name: Setup shared loopback sshd
        if: matrix.ssh == true
        run: |
          set -euo pipefail
          MUXTERM_ENV_FILE="$RUNNER_TEMP/muxterm-sshd.env" bash scripts/ci/setup-sshd.sh
          cat "$RUNNER_TEMP/muxterm-sshd.env" >> "$GITHUB_ENV"
        timeout-minutes: 5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-four-mode-${{ matrix.case }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Build FFI binary
        run: cargo build --no-default-features --features ffi

      - name: Run local Four-Mode case
        if: matrix.ssh == false
        run: timeout 120 cargo test --no-default-features --features ffi --test four_mode_integration -- ${{ matrix.filter }} --nocapture

      - name: Run SSH Four-Mode case
        if: matrix.ssh == true
        run: timeout 120 cargo test --no-default-features --features ffi --test four_mode_integration -- ${{ matrix.filter }} --nocapture --ignored
        env:
          RUST_BACKTRACE: 1

      - name: Upload sshd logs on failure
        if: failure() && matrix.ssh == true
        uses: actions/upload-artifact@v4
        with:
          name: sshd-logs-${{ matrix.case }}
          path: ${{ env.MUXTERM_SSHD_TMP_DIR }}
          retention-days: 7

      - name: Cleanup sshd
        if: always() && matrix.ssh == true
        run: |
          if [ -n "${MUXTERM_SSHD_TMP_DIR:-}" ] && [ -f "$MUXTERM_SSHD_TMP_DIR/sshd.pid" ]; then
            kill "$(cat "$MUXTERM_SSHD_TMP_DIR/sshd.pid")" 2>/dev/null || true
            rm -rf "$MUXTERM_SSHD_TMP_DIR"
          fi

  four_mode_aggregate:
    name: four-mode / aggregate
    if: always()
    needs: [four_mode]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Four-Mode cases
        run: test "${{ needs.four_mode.result }}" = success

  core_required:
    name: core / required
    if: always()
    needs: [core_tests, four_mode_aggregate]
    runs-on: ubuntu-latest
    steps:
      - name: Require core and Four-Mode aggregates
        run: |
          test "${{ needs.core_tests.result }}" = success
          test "${{ needs.four_mode_aggregate.result }}" = success
