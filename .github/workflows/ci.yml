name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Ubuntu：core / TUI（fmt + clippy + test）
  ci:
    name: check / fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            tmux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --no-default-features --features tui -- -D warnings

      - name: cargo test
        run: cargo test --no-default-features --features tui
        timeout-minutes: 15

      - name: Install GTK4 deps
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libssl-dev

      - name: cargo check gtk
        # 只编译检查：CI runner 无显示器，不跑 GTK UI 测试
        run: cargo check --features gtk

  # macOS：FFI release 构建 → macos_integration → XCUITest
  # macos-latest 现为 macos-26（核对时间 2026-07-24，
  # https://github.com/actions/runner-images/issues/14167 ）
  macos:
    name: macos / ffi / XCUITest
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # 与 .cargo/config.toml 的 ../muxterm-target 对齐（相对仓库根）
      CARGO_TARGET_DIR: ${{ github.workspace }}/../muxterm-target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version
          /usr/bin/automationmodetool || true

      - name: Install tools
        run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          tmux -V
          xcodegen --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ github.workspace }}/../muxterm-target
          key: ${{ runner.os }}-macos-cargo-${{ hashFiles('**/Cargo.toml', '**/Package.resolved') }}

      - name: cargo build ffi (release)
        run: cargo build --release --no-default-features --features ffi

      - name: cargo test macos_integration
        # 与 release 构建同 feature 集；勿拉默认 gtk
        run: cargo test --no-default-features --features ffi --test macos_integration
        timeout-minutes: 15

      - name: Generate Xcode project
        working-directory: src/platform/macos
        run: |
          mkdir -p Vendor
          ln -sfn ../../../../../muxterm-target/release/libmuxterm.a Vendor/libmuxterm.a
          xcodegen generate

      - name: XCUITest
        working-directory: src/platform/macos
        run: |
          set -o pipefail
          xcodebuild test \
            -project Muxterm.xcodeproj \
            -scheme MuxtermApp \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MuxtermAppUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            ENABLE_DEBUG_DYLIB=NO \
            | xcbeautify --renderer github-actions
