name: Website

# Static official site for Muxterm. The workflow publishes the contents of
# `website/` to GitHub Pages. Enable Pages once in repository settings:
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# The site is plain HTML, CSS and JavaScript. No build step, no Node runtime,
# and no package manager are required.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Validate site files
        run: |
          set -euo pipefail
          test -f website/index.html
          test -f website/docs.html
          test -f website/zh/index.html
          test -f website/zh/docs.html
          test -f website/404.html
          test -f website/assets/style.css
          test -f website/assets/tokens.css
          test -f website/assets/base.css
          test -f website/assets/app.js
          test -f website/assets/fonts/martian-mono-latin.woff2
          test -f website/.nojekyll

          for scene in workspace agents shells; do
            for theme in dark light; do
              test -f "website/assets/img/app-${scene}-${theme}.png"
            done
          done

          for theme in dark light; do
            test -f "website/assets/img/app-ports-${theme}.png"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
