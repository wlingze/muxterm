name: "CI: linux"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/platform/linux/**"
      - "src/core/**"
      - "src/platform/cli/**"
      - "src/platform/mod.rs"
      - "src/lib.rs"
      - "src/main.rs"
      - "tests/linux_gtk_integration.rs"
      - "tests/linux_herdr_e2e.rs"
      - "tests/linux_herdr_switch_e2e.rs"
      - "tests/linux_herdr_worktree_e2e.rs"
      - "tests/linux_herdr_ssh_e2e.rs"
      - "tests/linux_herdr_agent_e2e.rs"
      - "tests/linux_herdr_authority_e2e.rs"
      - "tests/linux_catalog_ssh_e2e.rs"
      - "tests/linux_existing_e2e.rs"
      - "tests/linux_fault_e2e.rs"
      - "tests/linux_scroll_wheel_e2e.rs"
      - "tests/linux_zoom_input_e2e.rs"
      - "tests/linux_panel_e2e.rs"
      - "tests/linux_render_e2e.rs"
      - "tests/linux_runtime_transport_matrix_e2e.rs"
      - "tests/herdr_direct_reattach.rs"
      - "tests/linux_attach_history_e2e.rs"
      - "tests/linux_attention_semantics_e2e.rs"
      - "tests/linux_search_e2e.rs"
      - "tests/support/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-linux.sh"
      - "scripts/build-common.sh"
      - "scripts/test.sh"
      - "scripts/ci/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  linux_checks:
    name: linux / required
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK / VTE / tmux / herdr / sshd dependencies
        run: |
          MUXTERM_ENV_FILE="$GITHUB_ENV" bash scripts/ci/setup.sh
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libssl-dev
        timeout-minutes: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-linux-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      # 与本地 scripts/test.sh 同一入口：一次编译、一起跑全部 GTK e2e。
      # fmt/clippy/check/全部 target 都在 test.sh 内，避免 CI 与本地两套命令 drift。
      # test.sh run linux 内部自带唯一一层 Xvfb；外层不得再套 xvfb-run（§13.2）。
      - name: Run all Linux GTK e2e tests (one compile)
        run: bash scripts/test.sh run linux

      # §13.4：失败时上传 matrix child 日志（只含隔离 fixture 内容，
      # 不含用户默认 session/私钥）。
      - name: Upload matrix artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-matrix-artifacts
          path: /tmp/muxterm-matrix-artifacts/**
          if-no-files-found: ignore
