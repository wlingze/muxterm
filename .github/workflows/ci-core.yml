name: "CI: core"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/**"
      - "src/lib.rs"
      - "src/main.rs"
      # TUI / CLI / 共享 FFI 模块属于 core 测试范围。
      # GPUI、GTK、Swift 前端各有自己的门禁，不在这里跑。
      - "src/frontend/**"
      - "!src/frontend/gpui/**"
      - "!src/frontend/linux/**"
      - "!src/frontend/macos/**"
      - "tests/cli_integration.rs"
      - "tests/four_mode_integration.rs"
      - "tests/sendkeys_regression.rs"
      - "tests/split_regression.rs"
      - "tests/tui_split_ffi_regression.rs"
      - "tests/tui_wizard_ffi_regression.rs"
      - "tests/tui_wizard_ssh_ffi_regression.rs"
      - "tests/ssh_no_fallback.rs"
      - "tests/ssh_transport_unit.rs"
      - "tests/tmux_backend_integration.rs"
      - "tests/tui_integration.rs"
      - "tests/herdr_session_contract.rs"
      - "tests/herdr_feature_contract.rs"
      - "tests/herdr_locale_contract.rs"
      - "tests/tmux_locale_contract.rs"
      - "tests/herdr_authority_contract.rs"
      - "tests/herdr_multi_workspace_contract.rs"
      - "tests/herdr_worktree_contract.rs"
      - "tests/herdr_protocol_compat.rs"
      - "tests/existing_ssh_contract.rs"
      - "tests/runtime_transport_matrix_contract.rs"
      - "tests/ffi_tmux_discovery.rs"
      - "tests/support/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/build-cli.sh"
      - "scripts/build-common.sh"
      - "scripts/build-tui.sh"
      - "scripts/test.sh"
      - "scripts/ci/**"
      - ".github/workflows/ci-core.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  # setup.sh 用它读 herdr latest，避免匿名 API 的 60 次/小时限额。
  GH_TOKEN: ${{ github.token }}

jobs:
  ci_core:
    name: ci-core
    runs-on: ubuntu-latest
    # core 入口一次编译跑 lib/bin + 全部集成 target，含 four-mode 与 Herdr 契约。
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (tmux / herdr / sshd)
        run: MUXTERM_ENV_FILE="$GITHUB_ENV" bash scripts/ci/setup.sh
        timeout-minutes: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-${{ hashFiles('Cargo.toml') }}

      # 与本地 scripts/test.sh 同一入口：一次编译、一起跑全部测试。
      # fmt/clippy/全部 target 都在 test.sh 内，避免 CI 与本地两套命令 drift。
      # four-mode 的 SSH case 在 setup.sh 配好 loopback sshd 后由同一进程跑；
      # 没有 sshd 时测试自行 skip，不再拆单独的 matrix job。
      - name: Run all core tests (one compile)
        run: bash scripts/test.sh run core

      - name: Test Herdr 0.8.2 and 0.9.1 client socket compatibility
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/herdr-protocol"
          curl -fsSL --retry 3 \
            https://github.com/herdrdev/herdr/releases/download/v0.8.2/herdr-linux-x86_64 \
            -o "$RUNNER_TEMP/herdr-protocol/herdr-v082"
          curl -fsSL --retry 3 \
            https://github.com/herdrdev/herdr/releases/download/v0.9.1/herdr-linux-x86_64 \
            -o "$RUNNER_TEMP/herdr-protocol/herdr-v091"
          echo "976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4  $RUNNER_TEMP/herdr-protocol/herdr-v082" | sha256sum -c -
          echo "2a02fed16beb651ef006e1d43f048f652ca4dc58ad053cd2d44450563d5c54b7  $RUNNER_TEMP/herdr-protocol/herdr-v091" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/herdr-protocol/herdr-v082" "$RUNNER_TEMP/herdr-protocol/herdr-v091"
          MUXTERM_TEST_HERDR_V20_BINARY="$RUNNER_TEMP/herdr-protocol/herdr-v082" \
          MUXTERM_TEST_HERDR_V22_BINARY="$RUNNER_TEMP/herdr-protocol/herdr-v091" \
            cargo test --no-default-features --features tui,test-harness \
              --test herdr_protocol_compat -- --test-threads=1

      - name: Upload sshd logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-sshd-logs
          path: ${{ env.MUXTERM_SSHD_TMP_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup sshd
        if: always()
        run: |
          if [ -n "${MUXTERM_SSHD_TMP_DIR:-}" ] && [ -f "$MUXTERM_SSHD_TMP_DIR/sshd.pid" ]; then
            kill "$(cat "$MUXTERM_SSHD_TMP_DIR/sshd.pid")" 2>/dev/null || true
            rm -rf "$MUXTERM_SSHD_TMP_DIR"
          fi