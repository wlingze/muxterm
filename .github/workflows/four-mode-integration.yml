name: Four-Mode Integration (Linux)

on:
  push:
    branches: [main, "feat/**", "design/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 普通 Linux 集成测试（不需要 sshd）──
  standard:
    name: standard (local CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config tmux
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: four-mode-standard-${{ hashFiles('**/Cargo.toml') }}
      - name: Build (ffi)
        run: cargo build --no-default-features --features ffi
      - name: Local-shell CLI integration
        run: timeout 60 cargo test --no-default-features --features ffi --test four_mode_integration -- local_shell_cli --nocapture
      - name: Local-tmux CLI integration
        run: timeout 120 cargo test --no-default-features --features ffi --test four_mode_integration -- local_tmux_cli --nocapture
      - name: Split regression
        run: timeout 120 cargo test --no-default-features --features ffi --test split_regression -- --test-threads=1
      - name: Sendkeys regression
        run: timeout 60 cargo test --no-default-features --features ffi --test sendkeys_regression -- --test-threads=1
      - name: CLI integration
        run: timeout 60 cargo test --no-default-features --features tui --test cli_integration -- --test-threads=1
      - name: Tmux backend integration
        run: timeout 120 cargo test --no-default-features --features tui --test tmux_backend_integration -- --test-threads=1

  # ── SSH 集成测试（每 matrix job 启动一次共享 sshd）──
  ssh-integration:
    name: SSH integration (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case:
          - ssh-shell-cli
          - ssh-tmux-cli
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config tmux \
            openssh-server openssh-client
      - name: Setup shared loopback sshd
        run: |
          set -euo pipefail
          MUXTERM_ENV_FILE="$RUNNER_TEMP/muxterm-sshd.env" bash scripts/ci/setup-sshd.sh
          cat "$RUNNER_TEMP/muxterm-sshd.env" >> "$GITHUB_ENV"
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: four-mode-ssh-${{ hashFiles('**/Cargo.toml') }}
      - name: Build (ffi)
        run: cargo build --no-default-features --features ffi
      - name: Run ${{ matrix.case }}
        run: |
          timeout 120 cargo test --no-default-features --features ffi --test four_mode_integration -- ${{ matrix.case }} --nocapture --ignored
        env:
          RUST_BACKTRACE: 1
      - name: Upload sshd logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sshd-logs-${{ matrix.case }}
          path: ${{ env.MUXTERM_SSHD_TMP_DIR }}
          retention-days: 7
      - name: Cleanup sshd
        if: always()
        run: |
          if [ -n "${MUXTERM_SSHD_TMP_DIR:-}" ] && [ -f "$MUXTERM_SSHD_TMP_DIR/sshd.pid" ]; then
            kill "$(cat "$MUXTERM_SSHD_TMP_DIR/sshd.pid")" 2>/dev/null || true
            rm -rf "$MUXTERM_SSHD_TMP_DIR"
          fi
