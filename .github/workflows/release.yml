name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux CLI 二进制 —— 纯 TUI，单文件，零依赖 ──
  release-linux:
    name: Linux CLI (TUI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/
          key: release-linux-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo build --release --no-default-features --features tui
      - run: cargo test --release --no-default-features --features tui
      - run: |
          mkdir -p dist
          cp target/release/muxterm dist/muxterm-linux-x86_64
          cd dist && sha256sum muxterm-linux-x86_64 > muxterm-linux-x86_64.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # ── macOS .app 客户端 ──
  release-macos:
    name: macOS Client (.app)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install tmux xcodegen
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/
          key: release-macos-${{ hashFiles('**/Cargo.toml') }}
      - name: Build Rust FFI + macOS client
        run: |
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          cargo build --release --no-default-features --features ffi
          ./scripts/build-macos.sh
      - name: Package .app
        run: |
          mkdir -p dist
          cp -r build/macos/Muxterm.app dist/
          cd dist && zip -r muxterm-macos-arm64.zip Muxterm.app/
          sha256sum muxterm-macos-arm64.zip > muxterm-macos-arm64.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # ── Linux GTK 客户端（预留，待 GTK4 前端完善）──
