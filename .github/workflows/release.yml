name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libvte-2.91-gtk4-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE="muxterm-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${STAGE}"
          cp target/release/muxterm "dist/${STAGE}/"
          for f in README.md LICENSE LICENSE.md PRODUCT.md AGENTS.md; do
            if [ -f "$f" ]; then
              cp "$f" "dist/${STAGE}/"
            fi
          done
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          ls -lh "dist/${STAGE}.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: muxterm-${{ github.ref_name }}-linux-x86_64
          path: dist/*.tar.gz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
