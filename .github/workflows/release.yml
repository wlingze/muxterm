name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            tmux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-linux-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build TUI binary
        run: cargo build --release --no-default-features --features tui

      - name: Test
        run: cargo test --release --no-default-features --features tui

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/muxterm dist/muxterm-linux-x86_64
          chmod +x dist/muxterm-linux-x86_64
          # 生成 SHA256
          cd dist && sha256sum muxterm-linux-x86_64 > muxterm-linux-x86_64.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/muxterm-linux-x86_64
            dist/muxterm-linux-x86_64.sha256