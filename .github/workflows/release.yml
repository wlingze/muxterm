name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as prerelease (manual dispatch only)'
        required: false
        default: 'true'
        type: boolean
      platform:
        description: 'Which platform to build (all = macos + linux + windows; linux-cli = TUI)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux-cli
          - linux
          - macos
          - windows

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Resolve version ──────────────────────────────────────────
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      fs_version: ${{ steps.version.outputs.fs_version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      channel: ${{ steps.version.outputs.channel }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          # 发布通道由 tag 后缀决定：
          #   v1.2.3          → stable：构建 + 推送正式 release（占用 latest）
          #   v1.2.3-beta.1   → beta  ：构建 + 推送 prerelease（不占 latest）
          #   v1.2.3-alpha.1  → alpha ：只构建 + 上传 Actions artifacts，不推送 release
          # 其它带后缀的 tag（rc 等）按普通 prerelease 推送。
          # 手动 dispatch 一律是 prerelease（dev 版本，不覆盖 latest）。
          set_channel() {
            local tag="$1"
            if [[ "$tag" == *-alpha* ]]; then
              echo "channel=alpha" >> "$GITHUB_OUTPUT"
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            elif [[ "$tag" == *-* ]]; then
              if [[ "$tag" == *-beta* ]]; then
                echo "channel=beta" >> "$GITHUB_OUTPUT"
              else
                echo "channel=prerelease" >> "$GITHUB_OUTPUT"
              fi
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          }

          # Tag trigger: exact v* tag → release pipeline
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            FS_VERSION=$(echo "$VERSION" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "fs_version=$FS_VERSION" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            set_channel "$VERSION"
          else
            # Manual dispatch (always prerelease): nearest reachable v* tag + short SHA, or short SHA
            NEAREST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            SHORT_SHA=$(git rev-parse --short HEAD)
            if [[ -n "$NEAREST" ]]; then
              VERSION="${NEAREST}-dev.${SHORT_SHA}"
            else
              VERSION="${SHORT_SHA}"
            fi
            # Filesystem-safe version for artifact naming
            FS_VERSION=$(echo "$VERSION" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "fs_version=$FS_VERSION" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "channel=manual" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $VERSION (fs: $FS_VERSION)"

  # ── Unified gate ────────────────────────────────────────────
  # 与 ci-core / ci-gpui 同一套结构：先跑一次三平台应当一致的测试，通过后
  # 再并行构建三个平台。这里跑 gpui 的统一门禁（fmt / clippy / frontend 单测 /
  # 无头验收 / release 构建）；更重的 core 契约套件在合并前的 ci-core 里跑，
  # 不重复烧 60 分钟。
  verify-unified:
    name: Unified checks
    # 只构建 TUI（linux-cli）的手动 dispatch 不需要跑 gpui 门禁。
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'linux-cli'
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GPUI system dependencies
        run: bash scripts/ci/setup-gpui-linux.sh
        timeout-minutes: 15

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target
          key: release-unified-${{ hashFiles('Cargo.toml') }}

      - name: Run unified GPUI checks
        run: bash scripts/test.sh run gpui-cross

  # ── Linux CLI (TUI) — command-line tool ─────────────────────
  build-linux-cli:
    name: Linux CLI (TUI)
    # Tag 发布只出三个 GPUI 桌面产物（macOS / Linux / Windows）；TUI 包仅在
    # 手动 dispatch 时按需构建，避免正式 release 混入非目标产物。
    if: github.event_name == 'workflow_dispatch' &&
        (inputs.platform == 'all' || inputs.platform == 'linux-cli')
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target
      FS_VERSION: ${{ needs.resolve-version.outputs.fs_version }}
      MUXTERM_BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target
          key: release-linux-cli-${{ hashFiles('**/Cargo.toml') }}

      - name: Build TUI (release)
        run: ./scripts/build-tui.sh --release

      - name: Verify binary
        run: |
          if [ ! -f build/linux/muxterm ]; then
            echo "ERROR: No Linux CLI binary produced (build/linux/muxterm)" >&2
            exit 1
          fi
          file build/linux/muxterm
          build/linux/muxterm --version || true

      - name: Package
        run: |
          mkdir -p staging
          cp build/linux/muxterm "staging/muxterm"
          cat > staging/README.txt <<'EOF'
          muxterm CLI (TUI) for Linux x86_64

          Runtime dependencies:
            - glibc (built on ubuntu-latest, requires compatible glibc)
            - tmux (for tmux control mode operations)

          Usage:
            ./muxterm --help
            ./muxterm --tui -L <socket>

          Checksums: see .sha256 file alongside this archive.
          EOF
          mkdir -p artifacts
          tar czf "artifacts/muxterm-cli-linux-x86_64-${FS_VERSION}.tar.gz" -C staging .
          cd artifacts
          sha256sum "muxterm-cli-linux-x86_64-${FS_VERSION}.tar.gz" > "muxterm-cli-linux-x86_64-${FS_VERSION}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: artifacts/*
          if-no-files-found: error

  # ── Linux GPUI app ──────────────────────────────────────────
  # 发布前端是 gpui（AGENTS.md）：Linux 产物就是 `muxterm gpui` 这条线。
  build-linux:
    name: Linux GPUI
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    needs: [resolve-version, verify-unified]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target
      FS_VERSION: ${{ needs.resolve-version.outputs.fs_version }}
      MUXTERM_BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GPUI system dependencies
        run: bash scripts/ci/setup-gpui-linux.sh
        timeout-minutes: 15
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target
          key: release-linux-gpui-${{ hashFiles('Cargo.toml') }}

      # 平台专属不变量：路径约定、本地 IPC 形态、默认 shell、终止语义。
      - name: Run platform tests (linux)
        run: bash scripts/test.sh run platform

      - name: Build Linux GPUI (release)
        run: ./scripts/build-gpui-linux.sh --release

      - name: Verify binary
        run: |
          if [ ! -f build/linux/muxterm ]; then
            echo "ERROR: No Linux GPUI binary produced (build/linux/muxterm)" >&2
            exit 1
          fi
          file build/linux/muxterm
          build/linux/muxterm --version || true
          test -f build/linux/share/applications/dev.muxterm.app.desktop

      - name: Package
        run: |
          mkdir -p staging
          cp build/linux/muxterm "staging/muxterm"
          cp -R build/linux/share staging/share
          # install.sh / README.txt 由 build-gpui-linux.sh 生成：GNOME 按 app_id
          # 在 ~/.local/share/applications 里查图标，不装就只有通用图标。
          cp build/linux/install.sh staging/install.sh
          cp build/linux/README.txt staging/README.txt
          chmod +x staging/install.sh
          mkdir -p artifacts
          tar czf "artifacts/muxterm-linux-x86_64-${FS_VERSION}.tar.gz" -C staging .
          cd artifacts
          sha256sum "muxterm-linux-x86_64-${FS_VERSION}.tar.gz" > "muxterm-linux-x86_64-${FS_VERSION}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-gpui
          path: artifacts/*
          if-no-files-found: error

  # ── macOS ARM app ───────────────────────────────────────────
  build-macos:
    name: macOS ARM
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    needs: [resolve-version, verify-unified]
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FS_VERSION: ${{ needs.resolve-version.outputs.fs_version }}
      MUXTERM_BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target
          key: release-macos-${{ hashFiles('**/Cargo.toml') }}

      - name: Run platform tests (macos)
        run: bash scripts/test.sh run platform

      - name: Build macOS app (GPUI)
        run: ./scripts/build-gpui-macos.sh --release

      - name: Verify binary and app dependencies
        run: |
          set -euo pipefail
          APP=build/macos/Muxterm.app
          # GPUI bundle 的可执行是 launcher 脚本，真正的 Mach-O 在 Resources 下
          # （LaunchServices 不能给 CFBundleExecutable 传参数，见构建脚本头注释）。
          LAUNCHER="$APP/Contents/MacOS/Muxterm"
          BIN="$APP/Contents/Resources/muxterm"
          test -x "$LAUNCHER"
          test -x "$BIN"
          test -f "$APP/Contents/Info.plist"
          test -d "$APP/Contents/_CodeSignature"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=4 "$APP"
          file "$BIN" | grep -E 'Mach-O 64-bit.*arm64'
          "$BIN" --version
          DEPS="$(otool -L "$BIN" | tail -n +2)"
          printf '%s\n' "$DEPS"
          if [[ "$DEPS" == *libmuxterm.dylib* ]]; then
            echo "ERROR: release app links libmuxterm.dylib instead of the static archive" >&2
            exit 1
          fi
          if [[ "$DEPS" == *"/Users/runner"* || "$DEPS" == *"/home/runner"* || "$DEPS" == *muxterm-target* ]]; then
            echo "ERROR: release app contains a build-machine dependency path" >&2
            exit 1
          fi

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p artifacts build/macos/dmg-root
          rm -rf build/macos/dmg-root/Muxterm.app
          cp -R build/macos/Muxterm.app build/macos/dmg-root/Muxterm.app
          # Provide the standard drag-to-install shortcut shown next to the app.
          ln -sfn /Applications build/macos/dmg-root/Applications
          DMG="artifacts/muxterm-macos-arm64-${FS_VERSION}.dmg"
          # GitHub macOS runner 上的 diskimages-helper 偶尔会卡住，hdiutil 报
          # "Resource temporarily unavailable"(EAGAIN)：create 已成功、镜像可读，
          # 但 verify 拿不到 helper 去识别格式。这是 runner 瞬时故障（
          # actions/runner-images#12323 同类），重试即可，不能让它烧掉整次发布。
          create_dmg() {
            hdiutil create \
              -volname Muxterm \
              -srcfolder build/macos/dmg-root \
              -ov \
              -format UDZO \
              "$DMG"
          }
          verify_dmg() {
            hdiutil verify "$DMG"
          }
          retry() {
            local attempts=3 delay=5
            for attempt in $(seq 1 "$attempts"); do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" == "$attempts" ]]; then
                echo "命令连续 ${attempts} 次失败: $*" >&2
                return 1
              fi
              echo "第 ${attempt} 次失败，${delay}s 后重试: $*" >&2
              sleep "$delay"
            done
          }
          retry create_dmg
          retry verify_dmg
          # checksum 文件里只留文件名：留在 artifacts/ 目录下生成会把前缀写进
          # 校验文件，用户下载后 `shasum -c` 会找不到文件。
          ( cd artifacts && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256" )

      - name: Verify DMG contents
        run: |
          set -euo pipefail
          DMG="artifacts/muxterm-macos-arm64-${FS_VERSION}.dmg"
          MOUNT="$RUNNER_TEMP/muxterm-dmg"
          mkdir -p "$MOUNT"
          # attach 同样会被卡住的 helper 影响；用与打包步骤一致的有界重试。
          for attempt in 1 2 3; do
            if hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "hdiutil attach 连续 3 次失败" >&2
              exit 1
            fi
            sleep 5
          done
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          test -d "$MOUNT/Muxterm.app"
          test -x "$MOUNT/Muxterm.app/Contents/MacOS/Muxterm"
          test -x "$MOUNT/Muxterm.app/Contents/Resources/muxterm"
          codesign --verify --deep --strict --verbose=4 "$MOUNT/Muxterm.app"
          test "$(find "$MOUNT" -mindepth 1 -maxdepth 1 -name 'Muxterm.app' | wc -l | tr -d ' ')" = 1
          # Finder needs an /Applications symlink for drag-to-install.
          test -L "$MOUNT/Applications"
          test "$(readlink "$MOUNT/Applications")" = "/Applications"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/*
          if-no-files-found: error

  # ── Windows GPUI app ────────────────────────────────────────
  # ConPTY 提供本地 shell；本地 Herdr 走命名管道（`\\.\pipe\<name>`）；
  # tmux 在 Windows 上没有可执行文件，tmux（以及远端 Herdr）走 SSH 目标。
  build-windows:
    name: Windows GPUI
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    needs: [resolve-version, verify-unified]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FS_VERSION: ${{ needs.resolve-version.outputs.fs_version }}
      MUXTERM_BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target
          key: release-windows-gpui-${{ hashFiles('Cargo.toml') }}

      - name: Run platform tests (windows)
        run: bash scripts/test.sh run platform

      - name: Build Windows GPUI (release)
        run: ./scripts/build-gpui-windows.sh --release

      - name: Verify binary
        run: |
          set -euo pipefail
          test -f build/windows/muxterm.exe
          ./build/windows/muxterm.exe --version
          powershell -NoProfile -Command \
            "(Get-Item build/windows/muxterm.exe).Length"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p staging artifacts
          cp build/windows/muxterm.exe staging/
          cp build/windows/dev.muxterm.app.png staging/ 2>/dev/null || true
          cat > staging/README.txt <<'EOF'
          muxterm (GPUI) for Windows x86_64

          Requirements:
            - Windows 10 1809+ (ConPTY) or Windows 11
            - A Vulkan or D3D12 capable GPU driver (software rendering works)

          Usage:
            muxterm.exe gpui
            muxterm.exe --help

          Notes:
            - 双击 muxterm.exe 直接打开窗口：Windows 上没有子命令时默认进 gpui。
            - 想用 TUI：`muxterm.exe tui`。
            - Local panes run through ConPTY (default shell: %COMSPEC%).
            - Herdr works locally through its Windows named pipe
              (\\.\pipe\<name>); the endpoint is discovered from
              `herdr status --json`.
            - tmux is a Unix program: use an SSH target (Windows -> Linux) for
              tmux sessions. SSH targets also carry Herdr and image paste.
            - The icon is shipped as dev.muxterm.app.png for manual shortcuts;
              the exe itself has no embedded icon yet (see docs/FRONTEND-GPUI.md).

          Checksums: see .sha256 file alongside this archive.
          EOF
          ARCHIVE_NAME="muxterm-windows-x86_64-${FS_VERSION}.zip"
          powershell -NoProfile -Command \
            "Compress-Archive -Path 'staging/*' -DestinationPath 'artifacts/${ARCHIVE_NAME}'"
          # 同上：校验文件里不能带 artifacts/ 前缀。
          ( cd artifacts && sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: windows-gpui
          path: artifacts/*
          if-no-files-found: error

  # ── Publish release (single job, no race) ──────────────────
  publish:
    name: Publish release
    # `always()` 是必须的：tag 发布不构建 Linux CLI，该 job 会被 skip，而
    # GitHub 会把「被依赖 job 被跳过」传播下去，导致 publish 一起被跳过
    # （beta 就发不出 release 了）。用 always() 继续执行，再用各 build 的
    # result == 'success' 精确表达「至少有一个平台构建成功」。
    if: always() &&
        needs.resolve-version.result == 'success' &&
        needs.resolve-version.outputs.should_publish == 'true' &&
        github.event_name != 'pull_request' &&
        (needs.build-linux-cli.result == 'success' ||
         needs.build-linux.result == 'success' ||
         needs.build-macos.result == 'success' ||
         needs.build-windows.result == 'success')
    needs: [resolve-version, verify-unified, build-linux-cli, build-linux, build-macos, build-windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FS_VERSION: ${{ needs.resolve-version.outputs.fs_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-assets -type f -exec cp {} dist/ \;
          ls -la dist/
          # 发布必须带齐三个桌面产物（macOS / Linux / Windows），缺一个就失败：
          # 某个平台构建失败时 publish 仍会因 always() 进入这里，不能静默发半个
          # release。
          for expected in \
            "muxterm-macos-arm64-${FS_VERSION}.dmg" \
            "muxterm-linux-x86_64-${FS_VERSION}.tar.gz" \
            "muxterm-windows-x86_64-${FS_VERSION}.zip"; do
            if [ ! -f "dist/$expected" ]; then
              echo "ERROR: 缺少发布产物 $expected" >&2
              exit 1
            fi
          done

      - name: Build updater manifest (latest.json)
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          FS_VERSION: ${{ needs.resolve-version.outputs.fs_version }}
          CHANNEL: ${{ needs.resolve-version.outputs.channel }}
          PRERELEASE: ${{ needs.resolve-version.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.resolve-version.outputs.source_sha }}
          REPO: ${{ github.repository }}
        run: |
          bash scripts/release-package.sh dist
          python3 -m json.tool dist/latest.json >/dev/null

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          target_commitish: ${{ needs.resolve-version.outputs.source_sha }}
          name: muxterm ${{ needs.resolve-version.outputs.version }}
          prerelease: ${{ needs.resolve-version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Download

            | Platform | Download | Notes |
            |----------|----------|-------|
            | macOS ARM64 (Apple silicon) | [muxterm-macos-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve-version.outputs.version }}/muxterm-macos-arm64.dmg) | DMG containing `Muxterm.app` (GPUI), macOS 13+ |
            | Linux x86_64 | [muxterm-linux-x86_64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve-version.outputs.version }}/muxterm-linux-x86_64.tar.gz) | GPUI app, needs libxkbcommon / wayland (or X11) / fontconfig / a Vulkan driver / tmux |
            | Windows x86_64 | [muxterm-windows-x86_64.zip](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve-version.outputs.version }}/muxterm-windows-x86_64.zip) | GPUI app, Windows 10 1809+ (ConPTY); local Herdr via named pipe, tmux and Herdr over SSH to Linux |
            | Update manifest | [latest.json](https://github.com/${{ github.repository }}/releases/download/${{ needs.resolve-version.outputs.version }}/latest.json) | Machine-readable metadata consumed by the built-in updater |

            Channel: `${{ needs.resolve-version.outputs.channel }}`（stable / beta / prerelease）.
            The built-in updater follows `releases/latest/download/latest.json`, so only
            **stable** releases become the automatic update target. To try a beta build,
            point `[update] manifest_url` at this release's `latest.json`.

            Each archive ships with a matching `.sha256` checksum file, and the
            built-in updater verifies that checksum before installing.

            **Source commit:** `${{ needs.resolve-version.outputs.source_sha }}`
