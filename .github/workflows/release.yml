name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as prerelease (manual dispatch only)'
        required: false
        default: 'true'
        type: boolean
      platform:
        description: 'Which platform to build (all, linux-cli, linux-gtk, macos)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux-cli
          - linux-gtk
          - macos

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Resolve version ──────────────────────────────────────────
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      fs_version: ${{ steps.version.outputs.fs_version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          # Tag trigger: exact v* tag → formal release
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "fs_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch (always prerelease): nearest reachable v* tag + short SHA, or short SHA
            NEAREST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            SHORT_SHA=$(git rev-parse --short HEAD)
            if [[ -n "$NEAREST" ]]; then
              VERSION="${NEAREST}-dev.${SHORT_SHA}"
            else
              VERSION="${SHORT_SHA}"
            fi
            # Filesystem-safe version for artifact naming
            FS_VERSION=$(echo "$VERSION" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "fs_version=$FS_VERSION" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
            echo "source_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $VERSION (fs: $FS_VERSION)"

  # ── Linux CLI (TUI) — command-line tool ─────────────────────
  build-linux-cli:
    name: Linux CLI (TUI)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-cli'
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target
      FS_VERSION: ${{ needs.resolve-version.outputs.fs_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target
          key: release-linux-cli-${{ hashFiles('**/Cargo.toml') }}

      - name: Build TUI (release)
        run: ./scripts/build-tui.sh --release

      - name: Verify binary
        run: |
          if [ ! -f build/linux/muxterm ]; then
            echo "ERROR: No Linux CLI binary produced (build/linux/muxterm)" >&2
            exit 1
          fi
          file build/linux/muxterm
          build/linux/muxterm --version || true

      - name: Package
        run: |
          mkdir -p staging
          cp build/linux/muxterm "staging/muxterm"
          cat > staging/README.txt <<'EOF'
          muxterm CLI (TUI) for Linux x86_64

          Runtime dependencies:
            - glibc (built on ubuntu-latest, requires compatible glibc)
            - tmux (for tmux control mode operations)

          Usage:
            ./muxterm --help
            ./muxterm --tui -L <socket>

          Checksums: see .sha256 file alongside this archive.
          EOF
          mkdir -p artifacts
          tar czf "artifacts/muxterm-cli-linux-x86_64-${FS_VERSION}.tar.gz" -C staging .
          cd artifacts
          sha256sum "muxterm-cli-linux-x86_64-${FS_VERSION}.tar.gz" > "muxterm-cli-linux-x86_64-${FS_VERSION}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: artifacts/*
          if-no-files-found: error

  # ── Linux GTK4 app ──────────────────────────────────────────
  build-linux-gtk:
    name: Linux GTK4
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux-gtk'
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target
      FS_VERSION: ${{ needs.resolve-version.outputs.fs_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config tmux \
            libgtk-4-dev libvte-2.91-gtk4-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            target
          key: release-linux-gtk-${{ hashFiles('**/Cargo.toml') }}

      - name: Build Linux GTK4 (release)
        run: ./scripts/build-linux.sh --release

      - name: Verify binary
        run: |
          if [ ! -f build/linux/muxterm ]; then
            echo "ERROR: No Linux GTK4 binary produced (build/linux/muxterm)" >&2
            exit 1
          fi
          file build/linux/muxterm
          build/linux/muxterm --version || true

      - name: Package
        run: |
          mkdir -p staging
          cp build/linux/muxterm "staging/muxterm"
          cat > staging/README.txt <<'EOF'
          muxterm GTK4 for Linux x86_64

          Runtime dependencies:
            - glibc (built on ubuntu-latest, requires compatible glibc)
            - libgtk-4-1, libvte-2.91-gtk4, libssl3
            - tmux (for tmux control mode operations)

          Usage:
            ./muxterm
            ./muxterm -L <socket>

          Checksums: see .sha256 file alongside this archive.
          EOF
          mkdir -p artifacts
          tar czf "artifacts/muxterm-gtk-linux-x86_64-${FS_VERSION}.tar.gz" -C staging .
          cd artifacts
          sha256sum "muxterm-gtk-linux-x86_64-${FS_VERSION}.tar.gz" > "muxterm-gtk-linux-x86_64-${FS_VERSION}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-gtk
          path: artifacts/*
          if-no-files-found: error

  # ── macOS ARM app ───────────────────────────────────────────
  build-macos:
    name: macOS ARM
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    needs: resolve-version
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FS_VERSION: ${{ needs.resolve-version.outputs.fs_version }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          brew list tmux >/dev/null 2>&1 || brew install tmux
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/
            ${{ github.workspace }}/../muxterm-target
          key: release-macos-${{ hashFiles('**/Cargo.toml') }}

      - name: Build macOS app
        run: ./scripts/build-macos.sh

      - name: Verify binary and app dependencies
        run: |
          set -euo pipefail
          APP=build/macos/Muxterm.app
          BIN="$APP/Contents/MacOS/Muxterm"
          test -x "$BIN"
          test -f "$APP/Contents/Info.plist"
          test -d "$APP/Contents/_CodeSignature"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=4 "$APP"
          file "$BIN" | grep -E 'Mach-O 64-bit.*arm64'
          DEPS="$(otool -L "$BIN" | tail -n +2)"
          printf '%s\n' "$DEPS"
          if [[ "$DEPS" == *libmuxterm.dylib* ]]; then
            echo "ERROR: release app links libmuxterm.dylib instead of the static archive" >&2
            exit 1
          fi
          if [[ "$DEPS" == *"/Users/runner"* || "$DEPS" == *"/home/runner"* || "$DEPS" == *muxterm-target* ]]; then
            echo "ERROR: release app contains a build-machine dependency path" >&2
            exit 1
          fi

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p artifacts build/macos/dmg-root
          rm -rf build/macos/dmg-root/Muxterm.app
          cp -R build/macos/Muxterm.app build/macos/dmg-root/Muxterm.app
          DMG="artifacts/muxterm-macos-arm64-${FS_VERSION}.dmg"
          hdiutil create \
            -volname Muxterm \
            -srcfolder build/macos/dmg-root \
            -ov \
            -format UDZO \
            "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Verify DMG contents
        run: |
          set -euo pipefail
          DMG="artifacts/muxterm-macos-arm64-${FS_VERSION}.dmg"
          MOUNT="$RUNNER_TEMP/muxterm-dmg"
          mkdir -p "$MOUNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          test -d "$MOUNT/Muxterm.app"
          test -x "$MOUNT/Muxterm.app/Contents/MacOS/Muxterm"
          codesign --verify --deep --strict --verbose=4 "$MOUNT/Muxterm.app"
          test "$(find "$MOUNT" -mindepth 1 -maxdepth 1 -name 'Muxterm.app' | wc -l | tr -d ' ')" = 1

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/*
          if-no-files-found: error

  # ── Publish release (single job, no race) ──────────────────
  publish:
    name: Publish release
    if: github.event_name != 'pull_request' &&
        (needs.build-linux-cli.result == 'success' ||
         needs.build-linux-gtk.result == 'success' ||
         needs.build-macos.result == 'success')
    needs: [resolve-version, build-linux-cli, build-linux-gtk, build-macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find release-assets -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          target_commitish: ${{ needs.resolve-version.outputs.source_sha }}
          name: muxterm ${{ needs.resolve-version.outputs.version }}
          prerelease: ${{ needs.resolve-version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Release artifacts

            | Artifact | Platform | Type | Runtime deps |
            |----------|----------|------|-------------|
            | `muxterm-cli-linux-x86_64-*.tar.gz` | Linux x86_64 | CLI/TUI command-line tool | glibc (ubuntu-latest), tmux for tmux ops |
            | `muxterm-gtk-linux-x86_64-*.tar.gz` | Linux x86_64 | GTK4 GUI app | glibc, libgtk-4-1, libvte-2.91-gtk4, libssl3, tmux |
            | `muxterm-macos-arm64-*.dmg` | macOS ARM64 | DMG containing `Muxterm.app` | macOS 13+ |

            Each artifact has a corresponding `.sha256` checksum file.

            **Source commit:** `${{ needs.resolve-version.outputs.source_sha }}`
